name: Pipeline de CI - targeting-service

on:
  push:
    branches: [deploy/bruno-891376974889]
  pull_request:
    branches: [deploy/bruno-891376974889]

jobs:
  ci:
    uses: zBrunoBessa/toggle-master-ci/.github/workflows/reusable-ci-python.yml@deploy/bruno-891376974889
    with:
      service-name: targeting-service
      ecr-repository: togglemaster/targeting-service
      needs-postgres: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.BRUNO_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BRUNO_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.BRUNO_AWS_SESSION_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.BRUNO_GITOPS_TOKEN }}
